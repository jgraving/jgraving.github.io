<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} — Jake Graving</title>
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="theme-color" content="#141c18">
  <meta name="color-scheme" content="dark light">
  <style>html,body{background:#141c18;color:#edf2e9}html[data-theme="light"],html[data-theme="light"] body{background:#f6f7f2;color:#25372e}</style>
  <script>if(location.hostname==="jgraving.github.io"){location.replace("https://jakegraving.com"+location.pathname+location.search+location.hash);}</script>
  <script>try{var t=localStorage.getItem('portfolio-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v=20261017-sun-moon" defer></script>
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  {% include favicons.html %}
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/material.css' | relative_url }}?v=20261017-readability">
  <script src="{{ '/assets/js/material.js' | relative_url }}" defer></script>
  <link rel="stylesheet" href="{{ '/assets/css/depth.css' | relative_url }}">
  <script src="{{ '/assets/js/depth.js' | relative_url }}" defer></script>
</head>
<body id="top">
<a class="skip-link" href="#main">Skip to content</a>
{% include site-header.html %}
<main id="main" class="legal-page wrap">
  <article aria-labelledby="legal-title">
    <header class="legal-heading"><a class="text-link" href="{{ '/' | relative_url }}">← Back to homepage</a><h1 id="legal-title">{{ page.title | escape }}</h1><p>{{ page.description | escape }}</p></header>
    <div class="legal-prose">{{ content }}</div>
  </article>
</main>
{% include site-footer.html %}
</body>
</html>
