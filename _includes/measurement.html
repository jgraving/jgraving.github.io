<div class="measurement" data-measurement data-base="{{ '/assets/videos/' | relative_url }}" data-images="{{ '/assets/images/research/' | relative_url }}">
  <div class="measurement-toolbar"><span>From pixels to posture</span><div class="measurement-species" role="group" aria-label="Choose an animal"><button type="button" data-species="zebra" aria-pressed="true">Zebras</button><button type="button" data-species="locust" aria-pressed="false">Locusts</button></div></div>
  <div class="measurement-stage">
    <img class="measurement-fallback" src="{{ '/assets/images/research/pose.webp' | relative_url }}" alt="Animal body landmarks estimated from video" width="768" height="384" loading="lazy">
    <canvas width="480" height="480" hidden aria-label="Matched footage and estimated body landmarks, divided by the reveal slider"></canvas>
    <div class="measurement-labels" aria-hidden="true"><span>Estimated pose</span><span>Footage</span></div>
    <div class="measurement-divider" aria-hidden="true"><span>↔</span></div>
    <input class="measurement-wipe" type="range" min="0" max="100" value="50" aria-label="Move the divider between footage and estimated pose" aria-valuetext="50 percent estimated pose">
  </div>
  <div class="measurement-controls"><button class="measurement-play" type="button">Play sequence <span aria-hidden="true">▶</span></button><span class="measurement-hint">Drag to reveal the measurement</span></div>
  <p class="measurement-note">Actual footage and model-estimated body landmarks. <span class="measurement-status" role="status"></span></p>
  <video hidden muted loop playsinline preload="none"></video>
</div>
