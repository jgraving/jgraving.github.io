- title: Circular statistics
  status: In progress
  description: New Bayesian methods for understanding direction and variability in
    animal behavior.
  collaboration: In collaboration with [James Foster](https://www.neurobiology.uni-konstanz.de/foster/), Neurobiology, University of Konstanz.
