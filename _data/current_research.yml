- title: Circular statistics
  status: In progress
  description: New Bayesian methods for understanding direction and variability in
    animal behavior.
  collaboration: In collaboration with [James Foster](https://www.neurobiology.uni-konstanz.de/foster/) · [University of Konstanz](https://www.uni-konstanz.de/en/).
  image: circular-statistics.png
  image_alt: Animal tracks, circular distributions, and Bayesian model summaries.
- title: Normative decision making
  status: In progress
  description: Exploring how movement, beliefs, and spatial geometry shape animal
    decisions.
  collaboration: In collaboration with [Iain Couzin](https://www.ab.mpg.de/couzin/) · [MPI-AB](https://www.ab.mpg.de/) / [University of Konstanz](https://www.uni-konstanz.de/en/).
  image: spatial-decisions.webp
  image_alt: Spatial decision model comparing posterior belief, Fisher information,
    and belief entropy around two alternative targets.
  video_file: /assets/videos/spatial-decisions.mp4
- title: Step selection in the wild
  status: In progress
  description: Using [HerdHover](https://www.herdhover.com/) data from Grévy’s and plains zebras to study how
    terrain and social surroundings shape movement choices.
  collaboration: In collaboration with [Blair Costelloe](https://blaircostelloe.com/) · [Mara Elephant Project](https://maraelephantproject.org/).
  image: zebra-step-selection.webp
  image_alt: 3D reconstruction of zebras moving across natural terrain.
  image_width: 1400
  image_height: 739
  terrain: true
- title: How honeybees organize their nests
  status: In progress
  description: Modeling how honeybee colonies organize brood and food stores across
    three-dimensional nests, and how that organization develops over time.
  collaboration: In collaboration with [Michael Smith](https://smithbeelab.com/) · [Auburn University](https://www.auburn.edu/).
  image: honeybee-nest-organization.webp
  image_alt: Three-dimensional honeybee nest maps comparing cell contents, model
    predictions, and prediction likelihood.
  image_width: 2048
  image_height: 857
